@if (label()) {
  <label class="color-label">{{ label() }}</label>
}

<button
  #triggerOrigin="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  class="color-trigger"
  [style.background-color]="color()"
  [attr.aria-label]="label() || null"
  (click)="toggle()"
></button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="triggerOrigin"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="panelPositions"
  [cdkConnectedOverlayViewportMargin]="viewportMargin"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="isOpen.set(false)"
  (detach)="isOpen.set(false)"
>
  <div class="color-panel">
    <div
      class="sv-surface"
      [style.background-color]="hueColor()"
      (pointerdown)="onSaturationValuePointerDown($event)"
      (pointermove)="onSaturationValuePointerMove($event)"
      (pointerup)="onSaturationValuePointerUp($event)"
      (pointercancel)="onSaturationValuePointerUp($event)"
    >
      <span
        class="sv-handle"
        [style.left.%]="saturationPercent()"
        [style.top.%]="valuePercent()"
      ></span>
    </div>

    <div
      class="hue-bar"
      (pointerdown)="onHuePointerDown($event)"
      (pointermove)="onHuePointerMove($event)"
      (pointerup)="onHuePointerUp($event)"
      (pointercancel)="onHuePointerUp($event)"
    >
      <span
        class="hue-handle"
        [style.left.%]="huePercent()"
      ></span>
    </div>

    <div class="code-row">
      <span
        class="code-preview"
        [style.background-color]="color()"
      ></span>
      <input
        class="color-code"
        type="text"
        spellcheck="false"
        autocomplete="off"
        [ngModel]="codeValue()"
        (ngModelChange)="onCodeInput($event)"
        (blur)="onCodeBlur()"
        [ngModelOptions]="{ standalone: true }"
        [attr.placeholder]="T.G.COLOR_CODE | translate"
        [attr.aria-label]="T.G.COLOR_CODE | translate"
      />
    </div>
  </div>
</ng-template>
