<h1 mat-dialog-title>{{ data.title }}</h1>

<mat-dialog-content>
  <div class="detail-field">
    <span class="field-label">{{ T.F.STATISTICS.DETAILS_LABEL | translate }}</span>
    <inline-markdown
      class="detail-editor"
      [model]="initialNotes"
      [taskId]="data.taskId"
      [isFocus]="true"
      [isShowControls]="true"
      [isShowChecklistToggle]="true"
      [placeholderTxt]="T.F.STATISTICS.DETAILS_PLACEHOLDER | translate"
      (changed)="onNotesChange($event)"
    ></inline-markdown>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="close()"
  >
    {{ T.G.CANCEL | translate }}
  </button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
  >
    {{ T.G.SAVE | translate }}
  </button>
</mat-dialog-actions>
